name: Attested experimental source archive
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: carnoa-source-provenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provenance:
    if: github.repository == 'Harks/carnoa-vault' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Log build environment (no secrets)
        run: node --version && npm --version
      - name: Verify tests and no third-party install scripts
        run: |
          npm ci --offline --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Build independently compared, checksum-listed source archive
        run: node scripts/build-source-release.mjs dist
      - name: Attest source archive provenance with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Verify uploaded attestation against GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.tgz --repo "$GITHUB_REPOSITORY"
      - name: Store ephemeral source archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-attested-source-${{ github.sha }}
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

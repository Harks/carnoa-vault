name: macOS synthetic companion CI
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'mac-companion/**'
      - '.github/workflows/mac-companion.yml'
  push:
    branches: [develop, main]
    paths:
      - 'mac-companion/**'
      - '.github/workflows/mac-companion.yml'
permissions:
  contents: read
jobs:
  swift-synthetic:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record Swift/macOS SDK version
        run: |
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Execute strictly synthetic unit tests
        run: swift test --package-path mac-companion
      - name: Compile native menu bar executable (never launch)
        run: swift build --configuration release --package-path mac-companion
      - name: Package and verify an ad-hoc signed *synthetic-only* .app (never distribute)
        shell: bash
        run: |
          OUTPUT="$(mktemp -d)"
          trap 'rm -rf "$OUTPUT"' EXIT
          bash mac-companion/Scripts/build-synthetic-demo-app.sh "$OUTPUT"
          bash mac-companion/Scripts/verify-synthetic-demo-app.sh "$OUTPUT/Carnoa Synthetic Demo.app"
          # Existing destination MUST NOT be overwritten by a second build.
          if bash mac-companion/Scripts/build-synthetic-demo-app.sh "$OUTPUT"; then
            echo "ERROR: packaging unexpectedly overwrote an existing artifact"
            exit 1
          fi
          # Never upload this unsigned/not-notarized bundle as a release artifact.


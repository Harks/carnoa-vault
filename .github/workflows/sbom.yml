name: SBOM evidence
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: carnoa-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked no-dependency package (no scripts, offline)
        run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: Create SPDX 2.3 SBOM using npm
        run: npm sbom --sbom-format=spdx --sbom-type=application > sbom.spdx.json
      - name: Validate application identity and zero external packages
        run: node scripts/verify-sbom.mjs sbom.spdx.json
      - name: Upload non-secret SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carnoa-vault-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
